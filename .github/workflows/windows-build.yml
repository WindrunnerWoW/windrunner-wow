name: Windows Build

on:
  workflow_dispatch:
    inputs:
      compiler_jobs:
        description: Parallel compiler jobs (1 = serial, the known-safe setting)
        required: false
        default: '1'
  pull_request:
    branches:
      - main

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      statuses: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-windows-server
        with:
          package: ${{ github.event_name != 'pull_request' }}
          compiler-jobs: ${{ inputs.compiler_jobs || '1' }}
          build-cache: ${{ github.event_name != 'pull_request' }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: windows-server
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: windows-sql
          path: ${{ env.SQL_ZIP_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Branch protection requires this exact context; PR workflow edits may not
      # register the Actions check name until merge, so report it explicitly.
      - name: Report required status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Windows Build / build',
              description: state === 'success'
                ? 'Windows build succeeded'
                : 'Windows build failed',
            });
