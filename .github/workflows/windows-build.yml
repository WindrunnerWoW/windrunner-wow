name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  BUILD_TYPE: Release
  _CL_: /MP1
  VCPKG_ROOT: C:/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}/install

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record pinned Crafting Storage module revision
        shell: pwsh
        run: |
          $commit = 'not-included'
          if (Test-Path 'modules/mod-crafting-storage/src' -PathType Container) {
            $commit = git -C modules/mod-crafting-storage rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw "could not resolve pinned mod-crafting-storage commit" }
          }
          "CRAFTING_STORAGE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "mod-crafting-storage: $commit"

      - name: Record pinned Crafting Orders module revision
        shell: pwsh
        run: |
          $commit = 'not-included'
          if (Test-Path 'modules/mod-crafting-orders/src' -PathType Container) {
            $commit = git -C modules/mod-crafting-orders rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw "could not resolve pinned mod-crafting-orders commit" }
          }
          "CRAFTING_ORDERS_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "mod-crafting-orders: $commit"

      # Pulling a moving module revision is intentionally limited to the main
      # push that feeds Windows Release. PR and manual builds retain the
      # superproject's gitlink pin for reproducibility.
      - name: Use latest Crafting Storage module for release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "submodule sync failed" }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "submodule initialization failed" }
          foreach ($module in @('mod-crafting-storage', 'mod-crafting-orders')) {
            if (-not (Test-Path "modules/$module/src" -PathType Container)) {
              Write-Host "$module not included; skipping remote update"
              continue
            }
            git submodule update --remote --checkout "modules/$module"
            if ($LASTEXITCODE -ne 0) { throw "failed to update $module from origin/main" }
            $commit = git -C "modules/$module" rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw "could not resolve $module commit" }
            $variable = switch ($module) {
              'mod-crafting-storage' { 'CRAFTING_STORAGE_COMMIT' }
              'mod-crafting-orders' { 'CRAFTING_ORDERS_COMMIT' }
            }
            "$variable=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Building release artifact with $module $commit"
          }

      - name: Archive name
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD)
          "GITHUB_SHORT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_NAME=tortoise-wow-windows-server-$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SQL_ARCHIVE_NAME=tortoise-wow-sql-$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bundle SQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $sqlRoot = Join-Path $root 'sql-bundle/sql'
          $Destination = $sqlRoot
          $BuildInfo = @(
            "commit=$env:GITHUB_SHA"
            "short=$env:GITHUB_SHORT_SHA"
            "ref=$env:GITHUB_REF"
            "mod_crafting_storage_commit=$env:CRAFTING_STORAGE_COMMIT"
            "mod_crafting_orders_commit=$env:CRAFTING_ORDERS_COMMIT"
          )
          Set-StrictMode -Version Latest

          function Copy-SqlTree {
              param(
                  [Parameter(Mandatory = $true)][string]$Source,
                  [Parameter(Mandatory = $true)][string]$Dest
              )

              New-Item -ItemType Directory -Force -Path $Dest | Out-Null
              Get-ChildItem -LiteralPath $Source -File -Filter '*.sql' | Sort-Object Name | ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $Dest $_.Name)
              }
              Get-ChildItem -LiteralPath $Source -Directory | Sort-Object Name | ForEach-Object {
                  Copy-SqlTree -Source $_.FullName -Dest (Join-Path $Dest $_.Name)
              }
          }

          $createDb = Join-Path $Root 'sql/create_databases.sql'
          $baseDir = Join-Path $Root 'sql/base'
          if (-not (Test-Path -LiteralPath $createDb)) { throw "Required SQL missing: sql/create_databases.sql" }
          if (-not (Test-Path -LiteralPath $baseDir)) { throw "Required SQL missing: sql/base/" }

          New-Item -ItemType Directory -Force -Path $Destination | Out-Null

          Copy-Item -LiteralPath $createDb -Destination (Join-Path $Destination 'create_databases.sql')
          Copy-SqlTree -Source $baseDir -Dest (Join-Path $Destination 'base')

          $dbUpdates = Join-Path $Root 'sql/database_updates'
          if (Test-Path -LiteralPath $dbUpdates) {
              Copy-SqlTree -Source $dbUpdates -Dest (Join-Path $Destination 'database_updates')
          } else {
              Write-Warning 'sql/database_updates/ missing; bundle will omit migration SQL'
          }

          $vendoredSql = @()
          $srcModules = Join-Path $Root 'src/modules'
          if (Test-Path -LiteralPath $srcModules) {
              Get-ChildItem -LiteralPath $srcModules -Directory | Sort-Object Name | ForEach-Object {
                  $world = Join-Path $_.FullName 'sql/world'
                  $chars = Join-Path $_.FullName 'sql/characters'
                  if (-not ((Test-Path -LiteralPath $world) -or (Test-Path -LiteralPath $chars))) {
                      return
                  }
                  $destName = $_.Name.ToLowerInvariant()
                  if (Test-Path -LiteralPath $world) {
                      Copy-SqlTree -Source $world -Dest (Join-Path $Destination "$destName/world")
                  } else {
                      Write-Warning "Vendored module $($_.Name) world SQL missing: $world"
                  }
                  if (Test-Path -LiteralPath $chars) {
                      Copy-SqlTree -Source $chars -Dest (Join-Path $Destination "$destName/characters")
                  } else {
                      Write-Warning "Vendored module $($_.Name) characters SQL missing: $chars"
                  }
                  $vendoredSql += $destName
              }
          }

          # Same folder names and pass order as AutoUpdater::ProcessUpdates.
          $moduleDbFolders = @('auth', 'character', 'world')
          $bundledModules = @()
          $modulesRoot = Join-Path $Root 'modules'
          if (Test-Path -LiteralPath $modulesRoot) {
              Get-ChildItem -LiteralPath $modulesRoot -Directory | Sort-Object Name | ForEach-Object {
                  $sqlRoot = Join-Path $_.FullName 'data/sql'
                  if (-not (Test-Path -LiteralPath $sqlRoot)) {
                      return
                  }
                  $copiedAny = $false
                  foreach ($dbFolder in $moduleDbFolders) {
                      $sourceFolder = Join-Path $sqlRoot $dbFolder
                      if (-not (Test-Path -LiteralPath $sourceFolder)) {
                          continue
                      }
                      $destFolder = Join-Path $Destination "modules/$($_.Name)/data/sql/$dbFolder"
                      Copy-SqlTree -Source $sourceFolder -Dest $destFolder
                      $copiedAny = $true
                  }
                  if ($copiedAny) {
                      $bundledModules += $_.Name
                  }
              }
          }

          Write-Host ("Bundled vendored SQL: " + $(if ($vendoredSql.Count) { $vendoredSql -join ', ' } else { '(none)' }))
          Write-Host ("Bundled module SQL: " + $(if ($bundledModules.Count) { $bundledModules -join ', ' } else { '(none)' }))

          @(
              $BuildInfo
              "vendored_sql=$($vendoredSql -join ',')"
              "bundled_modules=$($bundledModules -join ',')"
              "import_order=create_databases, base, database_updates, playerbots world then characters, modules auth then character then world (modules A-Z, files A-Z)"
          ) | Where-Object { $_ -ne $null -and $_ -ne '' } | Set-Content -LiteralPath (Join-Path $Destination 'BUILD_INFO.txt')

          $zip = Join-Path $root "$env:SQL_ARCHIVE_NAME.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $root 'sql-bundle/*') -DestinationPath $zip
          "SQL_ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
            C:/vcpkg/buildtrees
            C:/vcpkg/packages
          key: vcpkg-win-ace-boost-${{ hashFiles('.github/workflows/windows-build.yml') }}
          restore-keys: |
            vcpkg-win-ace-boost-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: ACE + Boost
        shell: pwsh
        run: |
          # No CMAKE_TOOLCHAIN_FILE — dep/windows owns OpenSSL/MySQL; toolchain mixes 3.x in.
          $pkgs = @(
            'ace:x64-windows',
            'boost-algorithm:x64-windows',
            'boost-asio:x64-windows',
            'boost-bimap:x64-windows',
            'boost-bind:x64-windows',
            'boost-filesystem:x64-windows',
            'boost-functional:x64-windows',
            'boost-smart-ptr:x64-windows',
            'boost-stacktrace:x64-windows',
            'boost-thread:x64-windows',
            'boost-system:x64-windows'
          )
          & "$env:VCPKG_ROOT/vcpkg.exe" install @pkgs --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Configure
        shell: pwsh
        run: |
          $v = "$env:VCPKG_ROOT/installed/x64-windows"
          cmake -B build -A x64 `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" `
            -DBUILD_PLAYERBOTS=ON `
            -DMODULES=static `
            -DUSE_EXTRACTORS=ON `
            -DALLOW_TURTLE_ADDONS=ON `
            -DACE_ROOT="$v" `
            -DBOOST_ROOT="$v" `
            -DBoost_NO_BOOST_CMAKE=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config $env:BUILD_TYPE --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Install
        shell: pwsh
        run: |
          cmake --install build --config $env:BUILD_TYPE
          if ($LASTEXITCODE -ne 0) { throw "install failed" }

      - name: Runtime DLLs
        shell: pwsh
        run: |
          $bin = "$env:VCPKG_ROOT/installed/x64-windows/bin"
          $dest = $env:INSTALL_DIR
          Copy-Item -Force "$bin/ACE.dll" $dest
          Copy-Item -Force "$bin/boost_*.dll" $dest

          foreach ($name in @(
              'mangosd.exe', 'realmd.exe',
              'mangosd.conf', 'realmd.conf', 'mods.conf', 'rate.conf',
              'aiplayerbot.conf', 'ahbot.conf')) {
            if (-not (Test-Path (Join-Path $dest $name))) {
              throw "missing $name in install dir"
            }
          }
          $stale = @(Get-ChildItem -Path $dest -Recurse -Filter '*.conf.dist' -File -ErrorAction SilentlyContinue)
          if ($stale.Count -gt 0) {
            throw ("config templates were installed without renaming: " + (($stale | ForEach-Object { $_.FullName }) -join ', '))
          }

          @(
            "commit=$env:GITHUB_SHA"
            "short=$env:GITHUB_SHORT_SHA"
            "ref=$env:GITHUB_REF"
            "mod_crafting_storage_commit=$env:CRAFTING_STORAGE_COMMIT"
            "mod_crafting_orders_commit=$env:CRAFTING_ORDERS_COMMIT"
          ) | Set-Content (Join-Path $dest 'BUILD_INFO.txt')

      - name: Zip
        shell: pwsh
        run: |
          $dest = (Resolve-Path $env:INSTALL_DIR).Path
          $confs = @(Get-ChildItem -Path $dest -Recurse -Filter '*.conf' -File)
          Write-Host 'Configs included in server zip:'
          foreach ($file in $confs) {
            Write-Host ('  ' + $file.FullName.Substring($dest.Length).TrimStart('\'))
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:ARCHIVE_NAME.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $dest '*') -DestinationPath $zip
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SQL_ARCHIVE_NAME }}
          path: ${{ env.SQL_ZIP_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Branch protection requires this exact context; PR workflow edits may not
      # register the Actions check name until merge, so report it explicitly.
      - name: Report required status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Windows Build / build',
              description: state === 'success'
                ? 'Windows build succeeded'
                : 'Windows build failed',
            });
